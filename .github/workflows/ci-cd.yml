name: CI/CD

on:
  push:
    branches: [main, homologacao]
  pull_request:
    branches: [main, homologacao]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r src/requirements.txt pytest

      - name: Rodar testes
        run: python -m pytest tests/ -v

  package:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Empacotar função (dependências + código)
        run: |
          mkdir -p build/package
          pip install -r src/requirements.txt --platform manylinux2014_x86_64 --python-version 3.12 --only-binary=:all: -t build/package
          cp src/*.py build/package/
          cd build/package && zip -r ../lambda.zip . -x '*.dist-info/*'

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: build/lambda.zip

  deploy:
    needs: package
    if: github.event_name == 'push' && vars.DEPLOY_TO_AWS == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-zip
          path: build

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.5"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_ambiente: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
        run: |
          terraform init
          terraform apply -auto-approve
